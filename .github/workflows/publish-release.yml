# Veil-Chromium — publish-release
#
# Forked from ungoogled-software/ungoogled-chromium-windows @ 151.0.7922.137-1.1 and trimmed for
# Veil, which is Windows-x64-only. Differences from upstream, all deliberate:
#
#   1. `build-x86` / `build-arm` removed from the trigger list, from the workflow table in
#      `resolve-release-context`, and from the artifact downloads. Upstream sets
#      `publishable=false` when ANY of the three architectures lacks a successful run at the
#      target SHA, so an x64-only fork that kept them would build for a day and publish nothing,
#      with no error logged anywhere.
#   2. `publish-winget` deleted. It hardcodes upstream's winget identifier
#      (`eloston.ungoogled-chromium`) and fork user (`Nifury`), needs `secrets.PAT`, and runs on
#      `ubuntu-slim` — a non-standard runner label that queues forever on a fork rather than
#      failing. Publishing to winget under upstream's identifier would also be wrong.
#   3. `update-binaries` deleted. Upstream bookkeeping against
#      `Nifury/ungoogled-chromium-binaries`, and a second `secrets.PAT` consumer.
#   4. `SHA256SUMS` plus an optional detached GPG signature is generated and published. Veil's
#      downloader does not need it — `checksum_source = "asset_digest"` uses the GitHub API's
#      per-asset digest — but users must be able to verify independently of GitHub.
#
# NOT changed, on purpose: the `run.event === 'push'` filter in the script and the job-level
# `github.event.workflow_run.event == 'push'` guard. A build started with `workflow_dispatch`
# will not satisfy them, so validate the pipeline by pushing a tag. `workflow_dispatch` stays as
# a manual escape hatch for re-publishing an already-built tag.
name: publish-release
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - build-x64
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  resolve-release-context:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.context.outputs.ready }}
      publishable: ${{ steps.runs.outputs.publishable }}
      target_tag: ${{ steps.context.outputs.target_tag }}
      target_sha: ${{ steps.context.outputs.target_sha }}
      x64_run_id: ${{ steps.runs.outputs.x64_run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Resolve target tag
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          DISPATCH_SHA: ${{ github.sha }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_REF_TYPE" != "tag" ]; then
              echo "Manual publish only runs on a tag ref. Current ref type: $DISPATCH_REF_TYPE"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            target_tag="$DISPATCH_REF_NAME"
            target_sha="$DISPATCH_SHA"
          else
            if [ "$WORKFLOW_RUN_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              echo "Triggered by a fork run; skipping publish."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            target_sha="$WORKFLOW_RUN_HEAD_SHA"
            candidate_tag="$WORKFLOW_RUN_HEAD_BRANCH"

            if [ -z "$candidate_tag" ] || ! git rev-parse -q --verify "refs/tags/$candidate_tag" >/dev/null; then
              echo "Upstream run was not triggered from a tag ref; skipping publish."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            tag_sha="$(git rev-list -n 1 "$candidate_tag")"
            if [ "$tag_sha" != "$target_sha" ]; then
              echo "Tag $candidate_tag does not point to $target_sha; skipping publish."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            target_tag="$candidate_tag"
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "target_tag=$target_tag" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $target_tag"
          echo "Resolved sha: $target_sha"

      - name: Locate latest successful build
        id: runs
        if: ${{ steps.context.outputs.ready == 'true' }}
        uses: actions/github-script@v9
        env:
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
        with:
          script: |
            // x64 only. Upstream iterated build-x64/x86/arm and set publishable=false if any
            // one of them was missing at the target SHA — see the header of this file.
            const workflows = [
              { key: 'x64', file: 'build-x64.yml' },
            ];
            const targetSha = process.env.TARGET_SHA;
            const outputs = { publishable: 'true' };

            for (const workflow of workflows) {
              const matches = [];
              for (let page = 1; page <= 10; page++) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow.file,
                  per_page: 100,
                  page,
                  status: 'completed',
                });

                matches.push(...data.workflow_runs.filter((run) =>
                  run.head_sha === targetSha &&
                  run.conclusion === 'success' &&
                  run.event === 'push'
                ));

                if (data.workflow_runs.length < 100) {
                  break;
                }
              }

              matches.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
              const latest = matches[0];
              if (!latest) {
                core.info(`No successful push-triggered run found for ${workflow.file} at ${targetSha}`);
                outputs.publishable = 'false';
                continue;
              }

              core.info(`Using ${workflow.file} run ${latest.id} from ${latest.created_at}`);
              outputs[`${workflow.key}_run_id`] = String(latest.id);
            }

            for (const [name, value] of Object.entries(outputs)) {
              core.setOutput(name, value);
            }
  publish-release:
    needs: resolve-release-context
    if: ${{ needs.resolve-release-context.outputs.ready == 'true' && needs.resolve-release-context.outputs.publishable == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download x64 package
        uses: actions/download-artifact@v8
        with:
          name: chromium
          path: artifacts/x64
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-release-context.outputs.x64_run_id }}

      # Names come from `package.py`, which builds them from `chromium_version.txt` +
      # `ungoogled-chromium/revision.txt` + `revision.txt` — NOT from the git tag. If the tag and
      # the asset names disagree, `revision.txt` is out of step with the tag you pushed.
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          set -euo pipefail
          find . -type f ! -name 'SHA256SUMS*' -printf '%P\n' | sort | while read -r f; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")")
          done > SHA256SUMS
          cat SHA256SUMS

      # Optional: publishes an unsigned SHA256SUMS when no key is configured, rather than
      # failing the release. Set the VEIL_GPG_PRIVATE_KEY secret (armored private key) and
      # VEIL_GPG_PASSPHRASE to turn signing on.
      - name: Sign SHA256SUMS
        id: sign
        working-directory: artifacts
        env:
          VEIL_GPG_PRIVATE_KEY: ${{ secrets.VEIL_GPG_PRIVATE_KEY }}
          VEIL_GPG_PASSPHRASE: ${{ secrets.VEIL_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${VEIL_GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning::VEIL_GPG_PRIVATE_KEY is not set; publishing SHA256SUMS unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$VEIL_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          gpg --batch --yes --pinentry-mode loopback \
            ${VEIL_GPG_PASSPHRASE:+--passphrase "$VEIL_GPG_PASSPHRASE"} \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-release-context.outputs.target_tag }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            artifacts/**/ungoogled-chromium*
            artifacts/SHA256SUMS*
